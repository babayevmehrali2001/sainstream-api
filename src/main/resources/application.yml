spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: saintstream-api
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:1111}