spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: saintstream-api
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: ${PORT:1111}

jwt:
  secret: ${JWT_SECRET}
  expires-in: ${JWT_EXPIRES_IN:15m}
  refresh-token-expires-days: ${REFRESH_TOKEN_EXPIRES_DAYS:7}